  - "docs/superpowers/specs/2026-05-03-claude-manager-design.md §5.2 (Data Discovery)"
  - "docs/DESIGN-CONTEXT.md §2.2 (sessions-index.json is STALE)"
  - "docs/DESIGN-CONTEXT.md §13 (key file paths)"

