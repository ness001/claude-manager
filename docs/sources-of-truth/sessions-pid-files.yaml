fixture:
  path: tests/sources-of-truth/fixtures/sessions-pid-files.json
  sanitization: |
    Source file: ~/.claude/sessions/13716.json (chosen because it exercises
    the optional `name` field). Verbatim copy with the following
    sanitization:
      - cwd: `C:\\Users\\lianli\\source\\laa-workspace` →
              `C:\\Users\\<user>\\source\\example-project`
              (replaces the local Windows username and a private project
              name; preserves the backslash-escaped path shape)
      - name: replaced the ADO URL + branch name with a neutral
              `fix example-project bug (Branch)` so no internal
              org/project/PR-id leaks. The structural marker `(Branch)` is
              preserved because it is part of the CLI's derived format.
    All numeric IDs (pid, startedAt, updatedAt), the sessionId UUID, the
    `version`, `peerProtocol`, `kind`, `entrypoint`, and `status` values
    are preserved byte-for-byte. The PID is not sensitive.
    synthetic: false
