name: ui-sweep-ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ui-sweep-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - '.github/workflows/ui-sweep-ci.yml'
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ui-sweep-ci.yml'

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Skip (no frontend changes)
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend paths changed — skipping build/test."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.frontend == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
        if: needs.changes.outputs.frontend == 'true'

      - name: Build (tsc + vite)
        if: needs.changes.outputs.frontend == 'true'
        run: npm run build

      - name: Test (vitest)
        if: needs.changes.outputs.frontend == 'true'
        run: npm test

  rust:
    name: rust
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Skip (no rust changes)
        if: needs.changes.outputs.rust != 'true'
        run: echo "No rust paths changed — skipping cargo check/test."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.rust == 'true'

      - name: Install Linux build deps for Tauri
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          workspaces: src-tauri

      - name: cargo check
        if: needs.changes.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        if: needs.changes.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo test --locked
